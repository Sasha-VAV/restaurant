[project]
name = "proxy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.14.0",
    "fastapi>=0.141.1",
    "grpcio>=1.83.0",
    "grpcio-tools>=1.83.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes (defaults)
    "I",             # isort — import sorting
    "UP",            # pyupgrade — modernize syntax for your target Python version
    "B",             # flake8-bugbear — common bug patterns (mutable defaults, etc.)
    "SIM",           # flake8-simplify
    "C4",            # flake8-comprehensions
]
